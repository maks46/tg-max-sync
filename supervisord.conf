[supervisord]
nodaemon=true
logfile=/app/logs/supervisord.log
logfile_maxbytes=5MB
logfile_backups=2
pidfile=/tmp/supervisord.pid
loglevel=info

[program:xray]
; 1. Fetches subscription and writes xray/config.json (via update-config.php).
; 2. Starts xray if config.json exists; exits cleanly (code 0) otherwise.
command=/bin/sh /app/xray/start.sh
autostart=true
autorestart=unexpected
exitcodes=0
startsecs=0
priority=10
stdout_logfile=/app/logs/xray.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile=/app/logs/xray.log
stderr_logfile_maxbytes=0

[program:sync-worker]
command=php /app/src/worker.php
autostart=true
autorestart=true
stdout_logfile=/app/logs/worker.out.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile=/app/logs/worker.err.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3
; Give xray time to establish the tunnel before the PHP worker starts.
; Xray needs ~10 s to fetch config and open the SOCKS5 port on startup.
startsecs=15
stopwaitsecs=10
priority=20

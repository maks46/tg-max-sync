[supervisord]
nodaemon=true
logfile=/app/logs/supervisord.log
pidfile=/tmp/supervisord.pid
loglevel=info

[program:xray]
; xray runs only when /app/xray-config.json is present.
; If the file is absent the process exits immediately with code 0 — supervisord
; will not restart it because exitcodes=0 is treated as "expected exit".
command=/bin/sh -c "[ -f /app/xray/config.json ] && exec /usr/local/bin/xray run -c /app/xray/config.json || echo 'xray: no config, skipping'"
autostart=true
autorestart=unexpected
exitcodes=0
startsecs=0
priority=10
stdout_logfile=/app/logs/xray.log
stderr_logfile=/app/logs/xray.log

[program:sync-worker]
command=php /app/src/worker.php
autostart=true
autorestart=true
stderr_logfile=/app/logs/worker.err.log
stdout_logfile=/app/logs/worker.out.log
; Give xray 3 s to establish the tunnel before the PHP worker starts
startsecs=5
stopwaitsecs=10
priority=20

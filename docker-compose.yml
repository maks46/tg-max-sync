services:
  sync-bot:
    build: .
    container_name: tg-max-sync
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./storage:/app/storage
      # xray configs (read-only). Generated config is written to /app/data/xray-config.json.
      - ./xray:/app/xray:ro
    environment:
      - TZ=Europe/Moscow
